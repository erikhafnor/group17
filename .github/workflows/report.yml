name: Report

# Builds report/main.pdf so both of us can check that the LaTeX compiles
# and download the current PDF from the run's artifacts.
on:
  push:
    branches: [dev, main]
    paths: ["report/**", ".github/workflows/report.yml"]
  pull_request:
    branches: [dev, main]
    paths: ["report/**", ".github/workflows/report.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build report PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: report

      - uses: actions/upload-artifact@v7
        with:
          name: report-pdf-${{ github.run_number }}
          path: report/main.pdf
          retention-days: 30
